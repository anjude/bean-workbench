# 复制到 topics/{日期}_{主题}/manifest.yaml 后填充
# 规则：抽不出来的字段留空（null / []），不臆造

topic: ""            # 主题中文简述，开题时定，之后不改
status: 在制          # 在制 / 已发布 / 已归档，必须与目录名前缀一致
platform: 公众号      # 公众号（默认）/ 小红书 / 跨平台
form: 文章            # 文章 / 图文 / 视频
mode: 强判断          # 强判断（默认）/ 事实流，讨论确认核心内容时定
delivery_mode: 落盘     # 落盘（改完直接写文件）/ 正文（每轮在对话里贴完整全文，不写文件）。由用户切换
created: "2026-09-08"  # 选题记录日，不改
published: null      # 发布日 "YYYY-MM-DD"，未发留 null
slots: ["01"]        # 已有槽位编号，落文件时更新
next: 讨论核心内容     # 下一步动作，一句话

# 本篇核心主张。开题阶段填中性版，讨论结束换成态度版，
# 成稿后与 04_发布稿.md 的核心主张保持一致。
conclusion: ""

# 按时间倒序记「什么时候定了什么」，只记影响走向的决定。
# 被否掉的切口也要记一条，避免下轮又绕回来。
decisions:
  - "2026-09-08 开题：切这个角度，不做概念科普"

# 当前悬而未决的事，没有就留空数组
blockers: []

# 发布后填，发布前全 null；详细分析在 06_复盘.md，这里只放数字
metrics:
  exposure: null     # 曝光
  likes: null        # 点赞
  collects: null     # 收藏
  comments: null     # 评论
  followers: null    # 涨粉

links:
  knowledge_base: [] # 关联的知识库条目
  sources: []        # 事实源、数据来源
  related: []        # 参考篇目
