<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>理财人格布局预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#ddd8ca;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#293b36}.phone{height:100dvh;max-width:430px;margin:auto;background:#f6f1e5;display:flex;flex-direction:column;overflow:hidden}.nav{padding:18px 20px 10px;font-weight:650;display:flex;justify-content:space-between}.progress{padding:4px 20px 12px;font-size:12px;color:#6a7b70}.bar{height:3px;background:#deded0;margin-top:9px}.bar i{display:block;width:25%;height:100%;background:#7d9f8b}.scene{flex:1;min-height:100px;overflow:auto;padding:8px 20px 12px}.card{border:1px solid #34493f;border-radius:12px;background:#fffaf0;padding:18px;box-shadow:0 3px #d4d6c4}.tag{font-size:12px;color:#74887a}.title{font-size:21px;font-weight:700;margin:16px 0}.quote{font-size:33px;color:#b4493e;font-weight:700;margin:8px 0 14px}.copy{font-size:15px;line-height:1.75;white-space:pre-line}.answer{flex:none;background:#f6f1e5;padding:12px 20px max(16px,env(safe-area-inset-bottom));border-top:1px solid #dedbcf}.prompt{font-size:17px;font-weight:700;margin:0 0 10px}.options{display:grid;gap:7px}.option{width:100%;border:1px solid #aab9aa;border-radius:9px;background:#fffaf0;padding:10px 12px;min-height:43px;text-align:left;font-size:14px;color:#293b36;line-height:1.35}.letter{display:inline-block;width:25px;color:#7b8a7b}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:#738075}.actions button{border:0;background:none;color:#63786b;padding:5px}.switch{position:fixed;top:10px;right:10px;background:#34493f;color:white;border:0;border-radius:20px;padding:9px 12px;z-index:2}@media(max-width:450px){.switch{top:auto;bottom:8px;right:10px;opacity:.85}}
</style><button class="switch" onclick="toggle()">切换题目</button><main class="phone"><div class="nav"><span>‹</span><span>理财人格</span><span>···</span></div><div class="progress">现场 <span id="num">03</span> / 13 <span style="float:right">选你真会做的</span><div class="bar"><i></i></div></div><section class="scene"><div class="card"><div class="tag">模拟现场</div><div class="title" id="title"></div><div class="quote" id="quote"></div><div class="copy" id="copy"></div></div></section><section class="answer"><div class="prompt" id="prompt"></div><div class="options" id="options"></div><div class="actions"><span>按第一反应选择</span><button>跳过</button></div></section></main><script>
const items=[{title:'好像错过了',quote:'+6%',copy:'上周你看中一只基金，犹豫了几天没买。\n今天再打开，它已经涨了 6%。\n你还是觉得它不错，只是现在买比上周贵了。',prompt:'这会儿你会？',options:['现在买，不能再错过一次','先买一点，剩下的等回落再说','等它跌回上周的价格，现在买太亏了','不买了，再看看别的机会']},{title:'钱要不要放一年',quote:'放满一年',copy:'你攒了一笔钱，暂时没有确定用途。\n看到一款理财产品，买入后要放满一年才能取出。\n你有点心动，又怕中途突然要用钱。',prompt:'你会怎么安排？',options:['买，钱放着也是放着','拿一部分买，剩下的留在手边','先算算这一年可能有哪些开销，再决定放多少','不买，钱拿不出来我心里不踏实']}];let index=0;function render(){const q=items[index];for(const k of ['title','quote','copy','prompt'])document.getElementById(k).textContent=q[k];document.getElementById('num').textContent=index?'04':'03';document.getElementById('options').innerHTML=q.options.map((x,i)=>`<button class="option"><span class="letter">${'ABCD'[i]}</span>${x}</button>`).join('');document.querySelector('.scene').scrollTop=0}function toggle(){index=1-index;render()}render();</script></html>
