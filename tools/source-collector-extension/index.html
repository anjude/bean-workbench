<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台 · 源信息采集</title><link rel="icon" href="icons/48.png"><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div class="brand">工作台 <span>来源工具</span></div><div class="eyebrow">来源资料，留在本机</div><h1>源信息采集</h1><p class="intro">批量收集 B 站视频字幕，把原始表达和来源一起保存下来。</p></header>
<section class="import-panel" aria-label="批量导入"><label for="input">视频链接 / BV 号</label><textarea id="input" rows="4" placeholder="每行一条，例如 BV1yUHP6rEYD&#10;也可粘贴完整 B 站视频链接"></textarea><div class="import-actions"><button id="add" class="primary">加入队列</button><button id="current">加入最近的 B 站页</button><label class="file-button">导入 TXT<input id="file" type="file" accept=".txt,text/plain"></label></div><p class="hint">重复链接会自动跳过。多 P 视频默认只采第 1 P，可在链接中用 ?p=2 指定分 P。本地转写单条最长 120 分钟。</p></section>
<details class="settings"><summary>本地转写设置 <span>无现成字幕时使用</span></summary><div class="settings-content"><label>转写模型<select id="model"><option value="Xenova/whisper-small">质量优先 · Whisper Small</option><option value="Xenova/whisper-base">速度平衡 · Whisper Base</option><option value="Xenova/whisper-tiny">快速预览 · Whisper Tiny（中文误差较大）</option></select></label><label>运行设备<select id="device"><option value="wasm">CPU · 默认，已验证</option><option value="auto">自动 · 硬件 GPU 优先，失败切 CPU</option><option value="webgpu">GPU · 耗时因设备而异</option></select></label><button id="cache" class="quiet">清理模型缓存</button><p class="hint">首次使用会下载模型并在本机缓存，音频和字幕保留在本机。机器转写的人名、数字和断句需要核对。</p></div></details>
<p id="notice" class="notice" role="status" hidden></p>
<section class="queue-section" aria-label="采集队列"><div class="queue-title"><div><h2>采集队列 <span id="count-all">0</span></h2><p id="run-state" class="hint">队列已暂停</p></div><div class="queue-actions"><button id="start" class="primary">开始采集</button><button id="pause">完成当前后暂停</button><button id="export" class="export">导出已完成（0）</button></div></div>
<div class="filters"><div role="group" aria-label="任务分组"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="pending">待处理 <span id="count-pending">0</span></button><button data-filter="success">已完成 <span id="count-success">0</span></button><button data-filter="error">失败 / 取消 <span id="count-error">0</span></button></div><div class="maintenance"><button id="retry-all" class="quiet">重试失败项</button><button id="clear" class="quiet muted">清理记录</button></div></div>
<div id="queue" aria-live="polite"></div><div id="pagination" class="pagination" hidden><button id="previous">上一页</button><span id="page-label"></span><button id="next">下一页</button></div><div id="empty" class="empty"><div class="empty-icon" aria-hidden="true">↳</div><h3 id="empty-title"></h3><p id="empty-copy"></p></div>
</section><footer>SRT + 纯文本 + 来源索引 · 采集结果自动保存在此浏览器的扩展数据中</footer>
</main><script type="module" src="ui.js"></script></body></html>
